<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bike Repair Management</title>
    <link rel="stylesheet" href="/admin-assets/admin.css" />
  </head>
  <body class="admin-page">
    <header class="topbar">
      <h1>Bike Repair Management</h1>
      <button id="logoutBtn" class="danger">Log Out</button>
    </header>

    <main class="dashboard-grid">
      <section class="card">
        <h2>Bookings</h2>
        <div class="filters">
          <label>
            Status
            <select id="statusFilter">
              <option value="all">All</option>
              <option value="Scheduled">Scheduled</option>
              <option value="Picked Up">Picked Up</option>
              <option value="In Repair">In Repair</option>
              <option value="Ready">Ready</option>
              <option value="Completed">Completed</option>
            </select>
          </label>
        </div>
        <div id="bookingStats" class="stats"></div>
        <div id="bookingList" class="list"></div>
      </section>

      <section class="card">
        <h2>Repair Pricing</h2>
        <form id="priceForm" class="stack">
          <input type="text" name="service_name" placeholder="Service name" required />
          <input type="text" name="description" placeholder="Description" />
          <input type="number" min="0" step="0.01" name="price" placeholder="Price" required />
          <button type="submit">Add Service</button>
        </form>
        <div id="priceList" class="list"></div>
      </section>
    </main>

    <template id="bookingTemplate">
      <article class="item booking-item">
        <div class="item-head">
          <h3></h3>
          <span class="meta status-pill"></span>
        </div>
        <p class="meta contact"></p>
        <p class="meta slot"></p>
        <p class="meta"></p>
        <p class="repair-needs"></p>
        <textarea class="internal-notes" rows="2" placeholder="Internal notes"></textarea>
        <div class="booking-actions">
          <select class="status-select">
            <option>Scheduled</option>
            <option>Picked Up</option>
            <option>In Repair</option>
            <option>Ready</option>
            <option>Completed</option>
          </select>
          <input class="quote-input" type="number" min="0" step="0.01" placeholder="Quoted $" />
          <button class="save-btn">Save</button>
        </div>
      </article>
    </template>

    <script src="/admin-assets/admin.js"></script>
  </body>
</html>
